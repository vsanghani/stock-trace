name: CI

# `deployment_status` runs the workflow file on the deployed ref, the commit
# Vercel deployed, including a pull request branch. It is not limited to the
# default branch.
on:
  pull_request:
    branches:
      - development
      - "feature/**"
  deployment_status:

permissions:
  contents: read
  pull-requests: read
  deployments: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          files="$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.cjs')"
          if [ -z "$files" ]; then
            echo "No changed JS/TS files to lint."
            exit 0
          fi
          printf '%s\n' "$files"
          printf '%s\n' "$files" | xargs npx eslint

      - name: Test
        run: npm test

      - name: Build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_dummy
          DATABASE_URL: postgres://localhost:5432/plutox
          SEC_USER_AGENT: Plutox ci@example.com
          OPENROUTER_API_KEY: dummy
          ALPHA_VANTAGE_API_KEY: dummy
          FMP_API_KEY: dummy
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
          NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /dashboard
          NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /dashboard
          # Present but unusable, so startup validation warns and Sentry stays off.
          SENTRY_DSN: not-a-url
          NEXT_PUBLIC_SENTRY_DSN: not-a-url
          SENTRY_AUTH_TOKEN: ""
          SENTRY_ORG: ""
          SENTRY_PROJECT: ""
          UPSTASH_REDIS_REST_URL: not-a-url
          UPSTASH_REDIS_REST_TOKEN: ""
        run: npm run build

  # Records whether Preview smoke is allowed to run. Secrets cannot be read from a
  # job-level `if`, so this job publishes a boolean output and the smoke job's
  # own `if` skips the job. A skipped job is not a green run. Do not mark
  # "Preview smoke" required until VERCEL_AUTOMATION_BYPASS_SECRET is set:
  # GitHub reports a skipped job's merge conclusion as success.
  smoke-preflight:
    name: Preview smoke preflight
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && !startsWith(github.event.deployment.environment || '', 'Production')
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.secret.outputs.enabled }}
    steps:
      - name: Check bypass secret
        id: secret
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -eu
          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Preview smoke skipped::VERCEL_AUTOMATION_BYPASS_SECRET is not set. The Preview smoke job is skipped and must not be a required check until that secret exists."
          fi

  smoke:
    name: Preview smoke
    needs: smoke-preflight
    if: needs.smoke-preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout matcher
        uses: actions/checkout@v4

      - name: Select preview deployment
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const { matchPreviewSmoke } = require(process.env.GITHUB_WORKSPACE + "/scripts/preview-smoke-match.cjs")
            const { owner, repo } = context.repo
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            })
            const decision = matchPreviewSmoke(
              {
                ref: context.payload.deployment?.ref,
                sha: context.payload.deployment?.sha,
              },
              pulls.map((pull) => ({
                number: pull.number,
                baseRef: pull.base.ref,
                headRef: pull.head.ref,
                headSha: pull.head.sha,
              }))
            )
            if (decision.action === "fail") {
              core.setOutput("action", "fail")
              core.setFailed(decision.message)
              return
            }
            if (decision.action === "skip") {
              core.setOutput("action", "skip")
              core.notice(decision.message)
              return
            }

            const url = context.payload.deployment_status.environment_url || context.payload.deployment_status.target_url
            if (!url || !String(url).startsWith("https://")) {
              core.setOutput("action", "fail")
              core.setFailed(`Preview deployment for pull request #${decision.pullNumber} succeeded without an https environment URL.`)
              return
            }
            core.info(decision.message)
            core.setOutput("action", "run")
            core.setOutput("url", String(url))

      - name: Request preview
        if: success() && steps.gate.outputs.action == 'run'
        env:
          PREVIEW_URL: ${{ steps.gate.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -eu
          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET}" ]; then
            echo "VERCEL_AUTOMATION_BYPASS_SECRET was empty inside Preview smoke."
            exit 1
          fi
          if [ -z "${PREVIEW_URL}" ]; then
            echo "Preview URL was not set. The deployment match step did not succeed."
            exit 1
          fi

          request() {
            path="$1"
            code="$(curl --silent --show-error --output /tmp/smoke-body --write-out '%{http_code}' \
              --max-time 30 \
              --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
              "${PREVIEW_URL}${path}")" || {
              echo "Request failed: ${path}"
              exit 1
            }
            echo "${path} -> ${code}"
            if [ "${code}" -ge 500 ]; then
              echo "Smoke check failed: ${path} returned ${code}"
              exit 1
            fi
            if [ "${code}" -eq 401 ] || [ "${code}" -eq 403 ]; then
              echo "Deployment protection rejected the bypass for ${path} (${code})."
              exit 1
            fi
          }

          request "/"
          request "/api/health"
