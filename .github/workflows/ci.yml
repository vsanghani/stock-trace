name: CI

# `deployment_status` only runs from the workflow file on the repository's
# default branch. Preview smoke stays dark until this file is on that branch.
on:
  pull_request:
    branches:
      - development
      - "feature/**"
  deployment_status:

permissions:
  contents: read
  pull-requests: read
  deployments: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          files="$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.cjs')"
          if [ -z "$files" ]; then
            echo "No changed JS/TS files to lint."
            exit 0
          fi
          printf '%s\n' "$files"
          printf '%s\n' "$files" | xargs npx eslint

      - name: Test
        run: npm test

      - name: Build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_dummy
          DATABASE_URL: postgres://localhost:5432/plutox
          SEC_USER_AGENT: Plutox ci@example.com
          OPENROUTER_API_KEY: dummy
          ALPHA_VANTAGE_API_KEY: dummy
          FMP_API_KEY: dummy
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
          NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /dashboard
          NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /dashboard
          # Present but unusable, so startup validation warns and Sentry stays off.
          SENTRY_DSN: not-a-url
          NEXT_PUBLIC_SENTRY_DSN: not-a-url
          SENTRY_AUTH_TOKEN: ""
          SENTRY_ORG: ""
          SENTRY_PROJECT: ""
          UPSTASH_REDIS_REST_URL: not-a-url
          UPSTASH_REDIS_REST_TOKEN: ""
        run: npm run build

  smoke:
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Select preview deployment
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const environment = String(context.payload.deployment?.environment ?? "")
            if (/production/i.test(environment)) {
              core.notice("Production deployment. Preview smoke checks were skipped.")
              core.setOutput("run", "false")
              return
            }

            const ref = String(context.payload.deployment?.ref ?? "")
            const { owner, repo } = context.repo
            const { data: pulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              per_page: 50,
            })
            const match = pulls.find((pull) => {
              const base = pull.base.ref
              const watched = base === "development" || base.startsWith("feature/")
              return watched && pull.head.ref === ref
            })
            if (!match) {
              core.notice(`No open pull request into development or feature/** for ref ${ref}. Preview smoke checks were skipped.`)
              core.setOutput("run", "false")
              return
            }

            const url = context.payload.deployment_status.environment_url || context.payload.deployment_status.target_url
            if (!url || !String(url).startsWith("https://")) {
              core.setFailed("Preview deployment succeeded without an https environment URL.")
              return
            }
            core.setOutput("run", "true")
            core.setOutput("url", String(url))

      - name: Request preview
        if: steps.gate.outputs.run == 'true'
        env:
          PREVIEW_URL: ${{ steps.gate.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -eu
          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET}" ]; then
            echo "::notice title=Preview smoke skipped::VERCEL_AUTOMATION_BYPASS_SECRET is not set. The preview was not requested. Add that repository secret to enable the check."
            exit 0
          fi

          request() {
            path="$1"
            code="$(curl --silent --show-error --output /tmp/smoke-body --write-out '%{http_code}' \
              --max-time 30 \
              --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
              "${PREVIEW_URL}${path}")" || {
              echo "Request failed: ${path}"
              exit 1
            }
            echo "${path} -> ${code}"
            if [ "${code}" -ge 500 ]; then
              echo "Smoke check failed: ${path} returned ${code}"
              exit 1
            fi
            if [ "${code}" -eq 401 ] || [ "${code}" -eq 403 ]; then
              echo "Deployment protection rejected the bypass for ${path} (${code})."
              exit 1
            fi
          }

          request "/"
          request "/api/search?q=AAPL"
